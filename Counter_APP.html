<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
           height: 100vh;
           width: 100%;
           border: 1px solid black;
           display: flex;
           justify-content: center;
           align-items: center;
          
        }
        .container{
           height: 50vh;
           width: 50vh;
           /* border: 1px solid blue; */
          display: flex;
          justify-content: center;
          align-items: center;
          flex-direction: column;
          /* border: 1px solid blue; */
        }
        .midDiv{
            height: 12vh;
            display: flex;
            justify-content: center;
            align-items: center;
            
            h1{
               
                color: blue;
            }
        }
        .outer{
            display: flex   ;
            gap: 10px;
           
        }
        .btn{
            button{
                height: 30px;
                width: 90px;
                border-radius: 10px;
               
            }
        }
         #bt1{
                color: white;
                    background-color: green;
                }
         #bt2{
                color: white;
                    background-color: red;
                }
         #bt3{
                color: white;
                    background-color: #f69e0a;
                }
         #bt4{
                color: white;
                    background-color:#6c7380;
                }
    </style>
</head>
<body>
    <div class="main" id="main">
        <div class="container">
            <div class="innerDiv">
                <h1>Counter App</h1>
                <!-- <h2>0</h2> -->
            </div>
            <div class="midDiv"><h1 id="head2">0</h1></div>
            <div class="outer">
                <div class="btn"><button id="bt1">Start</button></div>
                <div class="btn"><button id="bt2">Stop</button></div>
                <div class="btn"><button id="bt3">Reset</button></div>
                <div class="btn"><button id="bt4">Resume</button></div>
            </div>
        </div>
    </div>
    <script>
        let count=0;
        let clock=null;
        function start(){
            clock=setInterval(()=>{

                count++;
               let h2=document.querySelector("#head2");
               h2.innerHTML=count;
            },1000)
        }


        function end(){
            clearInterval(clock);
        }

       function reset(){
        end();
        count=0;
       
        let h2=document.querySelector("#head2");
        h2.innerHTML=count;
        }

     function resume(){
        if(clock != null){
            start();
        }
        return count==0;
        }

let st=document.querySelector("#bt1");
st.addEventListener("click",start);

let stop=document.querySelector("#bt2");
stop.addEventListener("click",end);

let resetbtn=document.querySelector("#bt3");
resetbtn.addEventListener("click",reset);

let resumebtn=document.querySelector("#bt4");
resumebtn.addEventListener("click",resume);
    </script>
</body>
</html>
